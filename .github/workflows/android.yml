name: Android CI - S20FE FIX
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: FIX - Burla check do build/gen
        run: |
          mkdir -p build/gen
          # cria dummy pra cmake não reclamar
          echo "extern \"C\" int dummy_gen = 0;" > build/gen/dummy.cpp
          # troca FATAL_ERROR por WARNING no CMakeLists.txt
          sed -i 's/message(FATAL_ERROR/message(WARNING/g' CMakeLists.txt || true
          sed -i 's/message( FATAL_ERROR/message(WARNING/g' CMakeLists.txt || true
          cat CMakeLists.txt | head -n 40

      - name: Patch S20FE Frio 30FPS
        run: |
          sed -i 's/g_swap_interval = 1/g_swap_interval = 2/g' runtime/src/gx2/gx2_core.cpp || true
          sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true
          sed -i 's/VK_PRESENT_MODE_IMMEDIATE_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WWHD-S20FE-FIXED
          path: android/app/build/outputs/apk/release/*.apk
