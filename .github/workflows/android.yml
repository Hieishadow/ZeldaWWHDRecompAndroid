name: Android CI - Fixed HEAT

on:
  workflow_dispatch:
  push:
    branches: [ "android" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Patch - Fix overheating (30fps lock)
      run: |
        echo "=== Patching GX2 ==="
        sed -i 's/g_swap_interval = 1/g_swap_interval = 2/' runtime/src/gx2/gx2_core.cpp
        sed -i 's/std::max<uint32>(arg(c, 0), 1)/std::max<uint32>(arg(c, 0), 2)/' runtime/src/gx2/gx2_core.cpp
        sed -i '/park_sleep_until/a \    std::this_thread::sleep_for(std::chrono::milliseconds(4));' runtime/src/gx2/gx2_core.cpp

        echo "=== Patching Vulkan FIFO ==="
        sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk.cpp
        sed -i 's/MAILBOX/FIFO/g' runtime/src/vk/vk.cpp || true

        echo "=== Forcing DEVICE_RECOMP ON ==="
        sed -i 's/WWHD_DEVICE_RECOMP.*OFF/WWHD_DEVICE_RECOMP ON/' CMakeLists.txt || true

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK + CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        add-to-path: true

    - name: Build native libs
      run: |
        chmod +x android/build_native.sh
        cd android
        # Compila libwwhd.so já com DEVICE_RECOMP=ON (não precisa de build/gen)
        ./build_native.sh || (
          echo "build_native.sh failed, trying cmake directly..."
          mkdir -p ../build/android
          cd ../build/android
          cmake ../.. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=30 -DWWHD_DEVICE_RECOMP=ON -G Ninja
          ninja
        )

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    - uses: actions/upload-artifact@v4
      with:
        name: WWHD-Android-FIXED-30FPS
        path: android/app/build/outputs/apk/release/*.apk
