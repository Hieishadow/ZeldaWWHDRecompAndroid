name: Android CI - Fixed HEAT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        add-to-path: true

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -PwwhdDeviceRecomp --stacktrace

    - name: Find APK
      if: always()
      run: find . -name "*.apk" -ls

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: WWHD-Android-FIXED-30FPS
        path: |
          **/*.apk
