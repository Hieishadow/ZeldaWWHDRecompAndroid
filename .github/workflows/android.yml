name: Android CI - Fixed HEAT
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Patch
      run: |
        sed -i 's/g_swap_interval = 1/g_swap_interval = 2/' runtime/src/gx2/gx2_core.cpp
        sed -i 's/std::max<uint32>(arg(c, 0), 1)/std::max<uint32>(arg(c, 0), 2)/' runtime/src/gx2/gx2_core.cpp
        sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        add-to-path: true
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -PwwhdDeviceRecomp --stacktrace
    - uses: actions/upload-artifact@v4
      with:
        name: WWHD-Android-FIXED-30FPS
        path: android/app/build/outputs/apk/**/*.apk
