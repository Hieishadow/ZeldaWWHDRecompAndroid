name: Android CI - S20FE FAST
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27

    - name: Patch S20FE Frio + 30FPS
      run: |
        sed -i 's/g_swap_interval = 1/g_swap_interval = 2/g' runtime/src/gx2/gx2_core.cpp || true
        sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true
        sed -i 's/VK_PRESENT_MODE_IMMEDIATE_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true
        find . -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/g_customDriverFailed = true/g_customDriverFailed = false/g' {} \; 2>/dev/null || true

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace

    - uses: actions/upload-artifact@v4
      with:
        name: WWHD-S20FE-FAST
        path: "**/build/outputs/apk/**/*.apk"
