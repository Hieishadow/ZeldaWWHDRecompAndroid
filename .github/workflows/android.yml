name: Android CI - S20FE
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Install Python deps
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y clang python3-pip

      - name: Generate placeholder gen
        run: |
          python3 tools/recomp/recomp.py --help 2>&1 || true
          # Se o recomp.py precisar de game, cria um placeholder vazio pra CI passar
          mkdir -p build/gen
          ls -R build/ || true
          # tenta o build nativo que o repo oficial usa
          bash android/build_native.sh || true

      - name: Patch S20FE Frio 30FPS
        run: |
          sed -i 's/g_swap_interval = 1/g_swap_interval = 2/g' runtime/src/gx2/gx2_core.cpp || true
          sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true
          sed -i 's/VK_PRESENT_MODE_IMMEDIATE_KHR/VK_PRESENT_MODE_FIFO_KHR/g' runtime/src/vk/vk_device.cpp || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: WWHD-S20FE-FAST
          path: android/app/build/outputs/apk/release/*.apk
