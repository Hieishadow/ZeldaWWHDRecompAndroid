name: Android CI - Fixed HEAT

on:
  push:
    branches: [ "android" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fix overheating - Force 30fps + FIFO
      run: |
        echo "Patching gx2_core.cpp..."
        sed -i 's/static uint32 g_swap_interval = 1;/static uint32 g_swap_interval = 2; \/\/ locked to 30fps to prevent CPU overheating on Android/' runtime/src/gx2/gx2_core.cpp
        sed -i 's/g_swap_interval = std::max<uint32>(arg(c, 0), 1);/g_swap_interval = std::max<uint32>(arg(c, 0), 2);/' runtime/src/gx2/gx2_core.cpp
        sed -i '/threads::park_sleep_until(vsync_time/a \    std::this_thread::sleep_for(std::chrono::milliseconds(4));' runtime/src/gx2/gx2_core.cpp

        echo "Patching Vulkan present mode..."
        # força FIFO em vez de MAILBOX
        find runtime/src/vk -name "*.cpp" -exec sed -i 's/VK_PRESENT_MODE_MAILBOX_KHR/VK_PRESENT_MODE_FIFO_KHR/g' {} \;
        find runtime/src/vk -name "*.cpp" -exec sed -i 's/MAILBOX/FIFO/g' {} \;

        echo "Forcing DEVICE_RECOMP ON..."
        sed -i 's/option(WWHD_DEVICE_RECOMP.*OFF)/option(WWHD_DEVICE_RECOMP "Android: no build\/gen" ON)/' CMakeLists.txt

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27
        add-to-path: true

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace -DWWHD_DEVICE_RECOMP=ON

    - uses: actions/upload-artifact@v4
      with:
        name: WWHD-Android-FIXED-HEAT
        path: android/app/build/outputs/apk/release/*.apk
